<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code de connexion — Fake scrolling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; padding: 12px 8px 0 4px">
    <a href="Login.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C1C1C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 24px 32px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">Entre le code</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E5E5B">On t’a envoyé un code à 6 chiffres par e-mail.</p>

    <div style="position: relative; margin-top: 12px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
          <span style="height: 58px; border-radius: 12px; border: 2px solid {{b.ring}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">{{b.d}}</span>
        </sc-for>
      </div>
      <label for="code-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Code à 6 chiffres</label>
      <input id="code-input" ref="{{inputRef}}" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{code}}" onChange="{{onCode}}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; cursor: text; font-size: 16px">
    </div>

    <sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 12px; border-radius: 12px; background: #1F6B4A; color: #FFFFFF; text-decoration: none; font: 600 16px 'IBM Plex Sans', sans-serif">Se connecter</a>
    </sc-if>
    <sc-if value="{{incomplete}}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled style="min-height: 52px; margin-top: 12px; border: 0; border-radius: 12px; background: #DEDEDA; color: #5E5E5B; font: 600 16px 'IBM Plex Sans', sans-serif">Se connecter</button>
    </sc-if>

    <sc-if value="{{canResend}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{resend}}" style="align-self: center; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1F6B4A; font: 600 15px 'IBM Plex Sans', sans-serif; cursor: pointer">Renvoyer le code</button>
    </sc-if>
    <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
      <p role="status" style="align-self: center; margin: 0; min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #5E5E5B">Renvoyer le code dans {{left}} s</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { code: '', sentAt: Date.now(), now: Date.now() };
  }
  componentDidMount() { this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var s = this.state;
    var left = Math.max(0, 30 - Math.floor((s.now - s.sentAt) / 1000));
    var boxes = [];
    for (var i = 0; i < 6; i++) boxes.push({ d: s.code[i] || '', ring: i === s.code.length ? '#1C1C1C' : '#DEDEDA' });
    return {
      code: s.code,
      boxes: boxes,
      onCode: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6) }),
      inputRef: (el) => { if (el && !this.focused) { this.focused = true; try { el.focus(); } catch (x) {} } },
      complete: s.code.length === 6,
      incomplete: s.code.length < 6,
      left: left,
      waiting: left > 0,
      canResend: left === 0,
      resend: () => this.setState({ sentAt: Date.now(), now: Date.now(), code: '' })
    };
  }
}
</script>
</body>
</html>
