<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier le profil — enregistrement en cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
@keyframes fs-spin{to{transform:rotate(360deg)}}
.fs-spin{animation:fs-spin 0.9s linear infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 4px; border-bottom: 1px solid #ECECEA">
    <button type="button" disabled style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #8A8A86; font: 400 16px 'IBM Plex Sans', sans-serif">Annuler</button>
    <h1 style="margin: 0; flex: 1; text-align: center; font-size: 17px; font-weight: 600">Modifier le profil</h1>
    <span style="min-width: 96px; min-height: 44px; display: flex; align-items: center; justify-content: center">
      <span role="status" aria-label="Enregistrement en cours" class="fs-spin" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid #DEDEDA; border-top-color: #1F6B4A"></span>
    </span>
  </header>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="edit-pseudo" style="font-size: 13px; font-weight: 600; color: #5E5E5B">Pseudo</label>
      <input id="edit-pseudo" type="text" value="Léa M." disabled style="height: 48px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 12px; padding: 0 14px; font: 400 16px 'IBM Plex Sans', sans-serif; color: #5E5E5B; background: #F5F5F4">
      <span style="align-self: flex-end; font: 400 12px 'IBM Plex Mono', monospace; color: #5E5E5B">6/16</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="edit-bio" style="font-size: 13px; font-weight: 600; color: #5E5E5B">Description</label>
      <textarea id="edit-bio" rows="3" disabled style="resize: none; border: 1px solid #DEDEDA; border-radius: 12px; padding: 12px 14px; font: 400 16px/1.45 'IBM Plex Sans', sans-serif; color: #5E5E5B; background: #F5F5F4">Ici pour ne rien voir.</textarea>
      <span style="align-self: flex-end; font: 400 12px 'IBM Plex Mono', monospace; color: #5E5E5B">22/80</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
