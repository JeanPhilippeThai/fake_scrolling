<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter un ami — envoi de la demande</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
@keyframes fs-spin{to{transform:rotate(360deg)}}
.fs-spin{animation:fs-spin 0.9s linear infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 10px 4px; border-bottom: 1px solid #ECECEA">
    <button type="button" aria-label="Retour" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h2 style="margin: 0; font-size: 18px; font-weight: 600">Ajouter un ami</h2>
  </header>
  <div style="padding: 14px 16px 6px">
    <div style="display: flex; align-items: center; height: 46px; box-sizing: border-box; border-radius: 12px; background: #F1F1EF; padding: 0 14px">
      <span aria-hidden="true" style="font: 500 16px 'IBM Plex Mono', monospace; color: #5E5E5B">@</span>
      <label for="add-handle" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Identifiant de ton ami</label>
      <input id="add-handle" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" value="lina" placeholder="identifiant" style="flex: 1; min-width: 0; height: 44px; border: 0; padding: 0 0 0 2px; background: transparent; font: 500 16px 'IBM Plex Mono', monospace; color: #1C1C1C">
    </div>
  </div>
  <div style="flex: 1; min-height: 0">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 16px">
      <span style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: #3A86FF; display: block">
        <span style="position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.65), transparent 60%); filter: blur(3px)"></span>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font: 600 15px 'IBM Plex Mono', monospace">@lina.r</span>
        <span style="font-size: 14px; color: #5E5E5B">Lina Roche</span>
      </span>
      <button type="button" disabled style="display: flex; align-items: center; justify-content: center; min-height: 36px; min-width: 92px; padding: 0 16px; border-radius: 10px; border: 0; background: #1F6B4A; color: #FFFFFF; font: 600 14px 'IBM Plex Sans', sans-serif">
          <span role="status" aria-label="Envoi en cours" class="fs-spin" style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #FFFFFF"></span>
        </button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 16px">
      <span style="position: relative; width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: #FB5607; display: block">
        <span style="position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.65), transparent 60%); filter: blur(3px)"></span>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font: 600 15px 'IBM Plex Mono', monospace">@lina</span>
        <span style="font-size: 14px; color: #5E5E5B">Lina Benali</span>
      </span>
      <button type="button" style="min-height: 36px; min-width: 92px; padding: 0 16px; border-radius: 10px; border: 0; background: #1F6B4A; color: #FFFFFF; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">Ajouter</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
