<!doctype html>

<head>

<title>Premium — paiement annulé</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F6F3; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 10px 8px 0 4px">
    <button type="button" aria-label="Retour" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
  </header>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 4px 28px 32px">
    <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px; background: #111111; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14)">
      <span style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 36px; line-height: 1; color: #FFFFFF; margin-top: -2px">F</span>
    </div>
    <span style="margin-top: 18px; font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #5E5E5B">Premium</span>
    <h1 style="margin: 6px 0 0; text-align: center; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">Soutenir fake scrolling</h1>

    <div role="img" aria-label="1 h 00 passées dans l’appli" style="position: relative; width: 216px; height: 216px; margin-top: 30px">
      <svg width="216" height="216" viewBox="0 0 216 216" aria-hidden="true"><circle cx="108" cy="108" r="96" fill="none" stroke="#1C1C1C" stroke-width="6"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.02em">1 h 00</span>
        <span style="font-size: 13px; color: #5E5E5B">passées ici</span>
      </div>
    </div>

    <div style="width: 100%; margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <p style="margin: 0; display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 15px; line-height: 1.55; color: #45453F"><span style="white-space: nowrap">Une heure passée ici.</span><span style="white-space: nowrap">Soutiens un projet indépendant.</span></p>
      <span style="margin-top: 14px; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">1,99 €</span>
      <span style="font-size: 13px; color: #5E5E5B">un seul paiement</span>
      <p role="status" style="margin: 14px 0 0; text-align: center; font-size: 14px; line-height: 1.4; color: #5E5E5B">Paiement annulé. Tu n’as pas été débité.</p>
      <button type="button" style="width: 100%; min-height: 54px; margin-top: 8px; border: 0; border-radius: 999px; background: #1C1C1C; color: #FFFFFF; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Soutenir le projet</button>
    </div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }
