<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion — Fake scrolling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; padding: 0 24px 32px; overflow: hidden">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div role="img" aria-label="Logo fake scrolling" style="width: 88px; height: 88px; border-radius: 22px; background: {{iconBg}}; display: flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 58px; line-height: 1; color: #FFFFFF; margin-top: -4px">F</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">fake scrolling</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; border: 1px solid #DEDEDA; background: #FFFFFF; color: #1C1C1C; text-decoration: none; font: 600 16px 'IBM Plex Sans', sans-serif">Continuer avec Google</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #1C1C1C; color: #FFFFFF; text-decoration: none; font: 600 16px 'IBM Plex Sans', sans-serif">Continuer avec Apple</a>

    <div style="display: flex; align-items: center; gap: 12px; margin: 6px 0">
      <span style="flex: 1; height: 1px; background: #DEDEDA"></span>
      <span style="font-size: 13px; color: #5E5E5B">ou</span>
      <span style="flex: 1; height: 1px; background: #DEDEDA"></span>
    </div>

    <label for="login-email" style="font-size: 14px; font-weight: 600">Adresse e-mail</label>
    <input id="login-email" type="email" inputmode="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" placeholder="toi@exemple.fr" style="height: 52px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 12px; padding: 0 14px; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1C1C1C; background: #FFFFFF">
    <sc-if value="{{valid}}" hint-placeholder-val="{{ false }}">
      <a href="Code.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #1F6B4A; color: #FFFFFF; text-decoration: none; font: 600 16px 'IBM Plex Sans', sans-serif">Recevoir un code</a>
    </sc-if>
    <sc-if value="{{invalid}}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled style="min-height: 52px; border: 0; border-radius: 12px; background: #DEDEDA; color: #5E5E5B; font: 600 16px 'IBM Plex Sans', sans-serif">Recevoir un code</button>
    </sc-if>
    <p style="margin: 4px 0 0; text-align: center; font-size: 12px; line-height: 1.5; color: #5E5E5B">Pas de mot de passe : on t’envoie un code par e-mail.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    var th = 'noir';
    try { th = localStorage.getItem('fs-theme') || 'noir'; } catch (e) {}
    this.state = { email: '', theme: th };
  }
  renderVals() {
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(this.state.email.trim());
    return {
      iconBg: ({ noir: '#111111', orange: 'linear-gradient(45deg, #FFC300 0%, #FF7A00 50%, #F2542D 100%)', rouge: '#E11D2E' })[this.state.theme] || '#111111',
      email: this.state.email,
      onEmail: (e) => this.setState({ email: e.target.value }),
      valid: ok,
      invalid: !ok
    };
  }
}
</script>
</body>
</html>
