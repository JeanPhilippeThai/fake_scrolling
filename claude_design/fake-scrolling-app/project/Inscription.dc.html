<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Inscription — Fake scrolling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; padding: 12px 8px 0 4px">
    <a href="Login.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C1C1C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 24px 32px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">Crée ton compte</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E5E5B">Choisis comment les autres te verront.</p>

    <label for="signup-name" style="margin-top: 12px; font-size: 14px; font-weight: 600">Pseudo</label>
    <input id="signup-name" type="text" autocomplete="nickname" maxlength="16" value="{{name}}" onChange="{{onName}}" placeholder="Ton pseudo" style="height: 52px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 12px; padding: 0 14px; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1C1C1C; background: #FFFFFF">

    <label for="signup-handle" style="margin-top: 4px; font-size: 14px; font-weight: 600">Identifiant</label>
    <div style="display: flex; align-items: center; height: 52px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 12px; padding: 0 14px; background: #FFFFFF">
      <span aria-hidden="true" style="font: 500 16px 'IBM Plex Mono', monospace; color: #5E5E5B">@</span>
      <input id="signup-handle" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{handle}}" onChange="{{onHandle}}" placeholder="identifiant" style="flex: 1; min-width: 0; height: 48px; border: 0; padding: 0 0 0 2px; background: transparent; font: 500 16px 'IBM Plex Mono', monospace; color: #1C1C1C">
    </div>
    <p style="margin: -6px 0 0; font-size: 13px; color: #5E5E5B">Minuscules, sans espace. Tes amis te trouvent avec.</p>

    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 12px; border-radius: 12px; background: #1F6B4A; color: #FFFFFF; text-decoration: none; font: 600 16px 'IBM Plex Sans', sans-serif">Créer mon compte</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled style="min-height: 52px; margin-top: 12px; border: 0; border-radius: 12px; background: #DEDEDA; color: #5E5E5B; font: 600 16px 'IBM Plex Sans', sans-serif">Créer mon compte</button>
    </sc-if>

    <p style="margin: 4px 0 0; text-align: center; font-size: 12px; line-height: 1.5; color: #5E5E5B">Photo et description : plus tard, depuis ton profil.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { name: '', handle: '' };
  }
  renderVals() {
    var s = this.state;
    var ok = s.name.trim().length > 0 && s.handle.length > 0;
    return {
      name: s.name,
      handle: s.handle,
      onName: (e) => this.setState({ name: e.target.value.slice(0, 16) }),
      onHandle: (e) => this.setState({ handle: e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, '') }),
      ready: ok,
      notReady: !ok
    };
  }
}
</script>
</body>
</html>
