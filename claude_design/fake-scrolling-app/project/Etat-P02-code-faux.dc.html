<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code de connexion — code faux</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; padding: 12px 8px 0 4px">
    <button type="button" aria-label="Retour" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1C1C1C; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 24px 32px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">Entre le code</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E5E5B">On t’a envoyé un code à 6 chiffres par e-mail.</p>

    <div role="img" aria-label="Code saisi : 4 8 2 9 1 5" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 12px">
      <span style="height: 58px; border-radius: 12px; border: 2px solid #B42318; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">4</span>
      <span style="height: 58px; border-radius: 12px; border: 2px solid #B42318; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">8</span>
      <span style="height: 58px; border-radius: 12px; border: 2px solid #B42318; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">2</span>
      <span style="height: 58px; border-radius: 12px; border: 2px solid #B42318; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">9</span>
      <span style="height: 58px; border-radius: 12px; border: 2px solid #B42318; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">1</span>
      <span style="height: 58px; border-radius: 12px; border: 2px solid #B42318; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 24px 'IBM Plex Mono', monospace; color: #1C1C1C">5</span>
    </div>
    <p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 14px; line-height: 1.4; color: #B42318">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.1"></path></svg>
      Ce code n’est pas le bon. Vérifie-le et réessaie.
    </p>

    <button type="button" disabled style="min-height: 52px; margin-top: 12px; border: 0; border-radius: 12px; background: #DEDEDA; color: #5E5E5B; font: 600 16px 'IBM Plex Sans', sans-serif">Se connecter</button>
    <p role="status" style="align-self: center; margin: 0; min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #5E5E5B">Renvoyer le code dans 12 s</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
