<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche — Fake scrolling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
.fs-noscroll{scrollbar-width:none}
.fs-noscroll::-webkit-scrollbar{display:none}
@keyframes fs-pop{0%{transform:scale(0.3);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}75%{transform:scale(1);opacity:1}100%{transform:scale(1.1) translateY(-40px);opacity:0}}
.fs-burst{animation:fs-pop 0.9s ease-out forwards}
@media (prefers-reduced-motion: reduce){.fs-burst{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; position: relative; overflow: hidden; filter: grayscale({{grey}}%); transition: filter 1.2s ease">
  <div style="flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column">
    <form onSubmit="{{onSearchSubmit}}" role="search" style="padding: 16px 16px 10px; margin: 0">
      <div style="position: relative">
        <label for="search-page" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E5B" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="search-page" type="search" autocomplete="off" value="{{query}}" onChange="{{onQuery}}" placeholder="Rechercher" style="width: 100%; height: 44px; box-sizing: border-box; border: 0; border-radius: 12px; padding: 0 14px 0 40px; background: #F1F1EF; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1C1C1C">
      </div>
    </form>
        <div style="flex: 1; min-height: 0; overflow-y: auto">
          <sc-if value="{{showIntro}}" hint-placeholder-val="{{ true }}">
            <section style="display: flex; flex-direction: column; padding: 2px 0 12px">
              <h2 style="margin: 0; padding: 6px 16px 4px; font-size: 16px; font-weight: 600">Suggestions</h2>
              <sc-for list="{{suggestions}}" as="g" hint-placeholder-count="8">
                <button type="button" onClick="{{g.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 16px; border: 0; background: transparent; color: #1C1C1C; font: 400 14px 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5E5E5B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                  <span style="flex: 1">{{g.label}}</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
                </button>
              </sc-for>
            </section>
            <section style="display: flex; flex-direction: column; padding: 6px 0 18px; border-top: 1px solid #ECECEA">
              <h2 style="margin: 0; padding: 12px 16px 6px; font-size: 16px; font-weight: 600">Tendances</h2>
              <sc-for list="{{trends}}" as="tr" hint-placeholder-count="6">
                <button type="button" onClick="{{tr.pick}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 6px 16px; border: 0; background: transparent; color: #1C1C1C; text-align: left; cursor: pointer">
                  <span style="width: 18px; font: 600 15px 'IBM Plex Mono', monospace; color: #5E5E5B">{{tr.rank}}</span>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 16px; font-weight: 600">{{tr.label}}</span>
                    <span style="font-size: 13px; color: #5E5E5B">{{tr.count}} posts</span>
                  </span>
                  <span aria-hidden="true" style="display: flex">
                    <span style="width: 22px; height: 40px; border-radius: 6px 0 0 6px; background: {{tr.c0}}"></span>
                    <span style="width: 22px; height: 40px; background: {{tr.c1}}"></span>
                    <span style="width: 22px; height: 40px; border-radius: 0 6px 6px 0; background: {{tr.c2}}"></span>
                  </span>
                </button>
              </sc-for>
            </section>
          </sc-if>
          <sc-if value="{{hasResults}}" hint-placeholder-val="{{ false }}">
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
              <sc-for list="{{results}}" as="t" hint-placeholder-count="9">
                <button type="button" onClick="{{t.open}}" aria-label="{{t.label}}" style="position: relative; aspect-ratio: 3 / 4; padding: 0; border: 0; overflow: hidden; background: {{t.bg}}; cursor: pointer">
                  <sc-for list="{{t.shapes}}" as="s" hint-placeholder-count="3">
                    <span style="position: absolute; left: {{s.x}}%; top: {{s.y}}%; width: {{s.w}}%; height: {{s.h}}%; background: {{s.c}}; border-radius: {{s.r}}"></span>
                  </sc-for>
                  <span style="position: absolute; left: 6px; bottom: 5px; display: flex; align-items: center; gap: 3px; color: #FFFFFF; font: 600 12px 'IBM Plex Sans', sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
                    {{t.likes}}
                  </span>
                </button>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <sc-if value="{{viewing}}" hint-placeholder-val="{{ false }}">
          <div role="dialog" aria-modal="true" aria-label="Résultats pour {{query}}" style="position: absolute; inset: 0; background: #1C1C1C">
            <div ref="{{scrollRef}}" onWheel="{{onWheel}}" onPointerDown="{{onDragStart}}" onPointerMove="{{onDragMove}}" onPointerUp="{{onDragEnd}}" onPointerCancel="{{onDragEnd}}" onKeyDown="{{onKey}}" tabIndex="0" aria-label="Résultat {{pageNum}} sur {{total}}" style="position: absolute; inset: 0; overflow: hidden; touch-action: none; container-type: size; outline: none">
              <div ref="{{trackRef}}" style="height: 100%; transform: translateY(calc({{negIdx}} * 100cqh)); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)">
                <sc-for list="{{results}}" as="it" hint-placeholder-count="2">
                  <article aria-label="Post de {{it.author}}" style="position: relative; height: 100cqh; overflow: hidden">
                    <div role="img" aria-label="{{it.alt}}" onClick="{{it.onTap}}" style="position: absolute; inset: 0; overflow: hidden; background: {{it.bg}}; cursor: pointer">
                      <sc-for list="{{it.shapes}}" as="s" hint-placeholder-count="4">
                        <span style="position: absolute; left: {{s.x}}%; top: {{s.y}}%; width: {{s.w}}%; height: {{s.h}}%; background: {{s.c}}; border-radius: {{s.r}}"></span>
                      </sc-for>
                    </div>

                    <sc-if value="{{it.showBurst}}" hint-placeholder-val="{{ false }}">
                      <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none">
                        <svg class="fs-burst" width="132" height="132" viewBox="0 0 24 24" fill="#FF5C7A" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
                      </div>
                    </sc-if>

                    <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; pointer-events: none">
                      <div style="align-self: flex-end; margin-right: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto">
                        <div aria-hidden="true" style="width: 46px; height: 46px; border-radius: 50%; border: 2px solid #FFFFFF; overflow: hidden; background: {{it.avatar}}">
                          <div style="width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.7), transparent 60%); filter: blur(2px)"></div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
                          <button type="button" onClick="{{it.toggleLike}}" aria-pressed="{{it.liked}}" aria-label="J’aime" style="width: 46px; height: 40px; padding: 0; border: 0; background: transparent; color: #FFFFFF; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); display: flex; align-items: center; justify-content: center; cursor: pointer">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="{{it.heartFill}}" stroke="{{it.heartStroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
                          </button>
                          <span style="margin-top: -2px; font: 600 12px 'IBM Plex Mono', monospace; line-height: 1.2; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75)">{{it.likes}}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
                          <button type="button" onClick="{{it.openComments}}" aria-label="Commentaires" style="width: 46px; height: 40px; padding: 0; border: 0; background: transparent; color: #FFFFFF; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); display: flex; align-items: center; justify-content: center; cursor: pointer">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.5 7.2L4 20l1-4.2A8 8 0 1 1 20 12z"></path></svg>
                          </button>
                          <span style="margin-top: -2px; font: 600 12px 'IBM Plex Mono', monospace; line-height: 1.2; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75)">{{it.comments}}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
                          <button type="button" onClick="{{it.openSave}}" aria-pressed="{{it.isSaved}}" aria-label="Enregistrer dans une collection" style="width: 46px; height: 40px; padding: 0; border: 0; background: transparent; color: #FFFFFF; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); display: flex; align-items: center; justify-content: center; cursor: pointer">
                            <svg width="29" height="29" viewBox="0 0 24 24" fill="{{it.saveFill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg>
                          </button>
                          <span style="margin-top: -2px; font: 600 12px 'IBM Plex Mono', monospace; line-height: 1.2; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75)">{{it.saves}}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
                          <button type="button" onClick="{{it.openShare}}" aria-label="Partager" style="width: 46px; height: 40px; padding: 0; border: 0; background: transparent; color: #FFFFFF; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); display: flex; align-items: center; justify-content: center; cursor: pointer">
                            <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"></path></svg>
                          </button>
                          <span style="margin-top: -2px; font: 600 12px 'IBM Plex Mono', monospace; line-height: 1.2; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75)">{{it.shares}}</span>
                        </div>
                      </div>
                      <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 76px 16px 16px; color: #FFFFFF; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75)">
                        <span style="font-weight: 600; font-size: 16px; line-height: 1.3">{{it.author}}</span>
                        <p style="margin: 0; font-size: 15px; line-height: 1.45">{{it.captionShown}}<sc-if value="{{it.canExpand}}" hint-placeholder-val="{{ false }}"> <button type="button" onClick="{{it.toggleMore}}" aria-expanded="{{it.expanded}}" style="pointer-events: auto; min-height: 24px; padding: 0; border: 0; background: transparent; color: #FFFFFF; font: 600 15px 'IBM Plex Sans', sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75); cursor: pointer">{{it.moreLabel}}</button></sc-if></p>
                      </div>
                    </div>
                  </article>
                </sc-for>
              </div>
            </div>
            <button type="button" onClick="{{closeView}}" aria-label="Retour aux résultats" style="position: absolute; top: 12px; left: 4px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6))">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
          </div>
        </sc-if>
  </div>

  <nav aria-label="Navigation principale" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #DEDEDA; background: #FFFFFF; padding: 6px 4px 14px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5E5E5B; font: 500 11px 'IBM Plex Sans', sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg>
      Accueil
    </a>
    <a href="Chat.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5E5E5B; font: 500 11px 'IBM Plex Sans', sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4V6a1 1 0 0 1 1-1z"></path></svg>
      Messages
    </a>
    <a href="Compose.dc.html" aria-label="Publier" style="display: flex; align-items: center; justify-content: center; min-height: 52px; text-decoration: none">
      <span style="width: 54px; height: 40px; border-radius: 13px; background: #1C1C1C; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </a>
    <a href="Search.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #1F6B4A; font: 600 11px 'IBM Plex Sans', sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      Recherche
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: #5E5E5B; font: 500 11px 'IBM Plex Sans', sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Profil
    </a>
  </nav>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
    <p role="status" style="position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); margin: 0; width: max-content; max-width: 330px; padding: 10px 16px; border-radius: 999px; background: #1C1C1C; color: #FFFFFF; font-size: 14px; text-align: center; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25)">{{toast}}</p>
  </sc-if>

  <sc-if value="{{sheetOn}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0">
      <button type="button" onClick="{{closeSheet}}" aria-label="Fermer" style="position: absolute; inset: 0; width: 100%; border: 0; padding: 0; background: rgba(28, 28, 28, 0.5); cursor: pointer"></button>
      <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 28px; border-radius: 24px 24px 0 0; background: #FFFFFF">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #DEDEDA"></span>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <h2 id="sheet-title" style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 22px">{{sheetTitle}}</h2>
          <button type="button" onClick="{{closeSheet}}" aria-label="Fermer" style="width: 44px; height: 44px; margin-right: -8px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>

        <sc-if value="{{sheetSave}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{collections}}" as="c" hint-placeholder-count="3">
              <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px solid {{c.ring}}; background: {{c.bg}}; color: #1C1C1C; font: 500 16px 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer">
                <span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: {{c.swatch}}; filter: blur(1px)"></span>
                <span style="flex: 1">{{c.name}}</span>
                <span style="font: 500 12px 'IBM Plex Mono', monospace; color: #1F6B4A">{{c.mark}}</span>
              </button>
            </sc-for>
            <button type="button" onClick="{{newCollection}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px dashed #8A8A86; background: #FFFFFF; color: #1C1C1C; font: 600 16px 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              Nouvelle collection
            </button>
          </div>
        </sc-if>

        <sc-if value="{{sheetShare}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 13px; font-weight: 600; color: #5E5E5B">Envoyer à</span>
              <div role="list" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none">
                <sc-for list="{{shareFriends}}" as="sf" hint-placeholder-count="5">
                  <button type="button" role="listitem" onClick="{{sf.send}}" aria-label="Envoyer à {{sf.first}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px; flex-shrink: 0; padding: 0; border: 0; background: transparent; color: #1C1C1C; cursor: pointer">
                    <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 50%; background: {{sf.avatar}}; filter: blur(1.5px)"></span>
                    <span style="max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px">{{sf.first}}</span>
                  </button>
                </sc-for>
              </div>
            </div>
            <button type="button" onClick="{{copyLink}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px solid #DEDEDA; background: #FFFFFF; color: #1C1C1C; font: 500 16px 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
              Copier le lien
            </button>
            <button type="button" onClick="{{shareElsewhere}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px solid #DEDEDA; background: #FFFFFF; color: #1C1C1C; font: 500 16px 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"></path></svg>
              Partager ailleurs
            </button>
          </div>
        </sc-if>

        <sc-if value="{{sheetComments}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 14px; overflow-y: auto; min-height: 0">
            <sc-for list="{{commentList}}" as="c" hint-placeholder-count="4">
              <div style="display: flex; gap: 10px">
