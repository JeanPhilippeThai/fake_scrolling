<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 4px; border-bottom: 1px solid #ECECEA">
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1C1C1C; font: 400 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Annuler</button>
    <h1 style="margin: 0; flex: 1; text-align: center; font-size: 17px; font-weight: 600">Modifier le profil</h1>
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1F6B4A; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Réessayer</button>
  </header>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px">
    <p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 14px; line-height: 1.4; color: #B42318">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.1"></path></svg>
      Tes modifications n’ont pas été enregistrées. Vérifie ta connexion et réessaie.
    </p>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="edit-pseudo" style="font-size: 13px; font-weight: 600; color: #5E5E5B">Pseudo</label>
      <input id="edit-pseudo" type="text" value="Léa M." style="height: 48px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 12px; padding: 0 14px; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1C1C1C; background: #FFFFFF">
      <span style="align-self: flex-end; font: 400 12px 'IBM Plex Mono', monospace; color: #5E5E5B">6/16</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="edit-bio" style="font-size: 13px; font-weight: 600; color: #5E5E5B">Description</label>
      <textarea id="edit-bio" rows="3" style="resize: none; border: 1px solid #DEDEDA; border-radius: 12px; padding: 12px 14px; font: 400 16px/1.45 'IBM Plex Sans', sans-serif; color: #1C1C1C; background: #FFFFFF">Ici pour ne rien voir.</textarea>
      <span style="align-self: flex-end; font: 400 12px 'IBM Plex Mono', monospace; color: #5E5E5B">22/80</span>
    </div>
  </div>
</div>
</x-dc>
