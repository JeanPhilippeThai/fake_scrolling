<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mise à jour requise — Fake scrolling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; padding: 0 24px 32px; overflow: hidden">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
    <div role="img" aria-label="Logo fake scrolling" style="width: 88px; height: 88px; border-radius: 22px; background: {{iconBg}}; display: flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 58px; line-height: 1; color: #FFFFFF; margin-top: -4px">F</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Mise à jour requise</h1>
    <p style="margin: 0; max-width: 310px; font-size: 16px; line-height: 1.5; color: #1C1C1C">Cette version de l’appli est trop ancienne. Mets-la à jour pour continuer : ton compte et tes envois en attente sont gardés.</p>
  </div>

  <button type="button" style="min-height: 52px; border: 0; border-radius: 12px; background: #1F6B4A; color: #FFFFFF; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Mettre à jour</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    var th = 'noir';
    try { th = localStorage.getItem('fs-theme') || 'noir'; } catch (e) {}
    this.state = { theme: th };
  }
  renderVals() {
    return {
      iconBg: ({ noir: '#111111', orange: 'linear-gradient(45deg, #FFC300 0%, #FF7A00 50%, #F2542D 100%)', rouge: '#E11D2E' })[this.state.theme] || '#111111'
    };
  }
}
</script>
</body>
</html>
