<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Conversation — photo non envoyée</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 10px; padding: 12px 8px 10px 4px; border-bottom: 1px solid #ECECEA">
    <button type="button" aria-label="Retour aux discussions" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 4.5px; display: flex">
      <span style="width: 100%; height: 100%; border-radius: 50%; background: #FF7A59; filter: blur(1.5px); display: block"></span>
    </span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-weight: 600; font-size: 16px; line-height: 1.25">Léa Martin</span>
      <span style="font-size: 12px; color: #5E5E5B">@lea.martin</span>
    </div>
    <button type="button" aria-label="Appel" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"></path></svg>
    </button>
  </header>

  <div style="flex: 1; min-height: 0; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <p style="margin: 0 0 8px; text-align: center; font-size: 12px; color: #5E5E5B">Aujourd’hui</p>
    <div style="display: flex; flex-direction: column; align-items: flex-start">
      <p style="margin: 0; max-width: 75%; padding: 9px 14px; border-radius: 20px; background: #F1F1EF; color: #1C1C1C; font-size: 16px; line-height: 1.4">Tu as vu mon dernier post ?</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end">
      <p style="margin: 0; max-width: 75%; padding: 9px 14px; border-radius: 20px; background: #1F6B4A; color: #FFFFFF; font-size: 16px; line-height: 1.4">Oui, enfin, à peu près.</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
      <div role="img" aria-label="Photo" style="width: 180px; height: 225px; box-sizing: border-box; border-radius: 18px; border: 2px solid #B42318; overflow: hidden; position: relative; background: #E3ECFF">
        <div style="position: absolute; inset: 0; filter: blur(14px)">
          <div style="position: absolute; left: 20px; top: 30px; width: 110px; height: 110px; border-radius: 50%; background: #8338EC"></div>
          <div style="position: absolute; left: 70px; top: 110px; width: 120px; height: 120px; border-radius: 30%; background: #EF476F"></div>
          <div style="position: absolute; left: -20px; top: 150px; width: 90px; height: 90px; border-radius: 50%; background: #FFBE0B"></div>
        </div>
      </div>
      <p role="alert" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #B42318">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.1"></path></svg>
        Non envoyée.
        <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #1C1C1C; font: 600 13px 'IBM Plex Sans', sans-serif; text-decoration: underline; cursor: pointer">Réessayer</button>
      </p>
    </div>
  </div>

  <div style="display: flex; padding: 8px 10px 26px; background: #FFFFFF; border-top: 1px solid #ECECEA">
    <div style="flex: 1; min-width: 0; display: flex; align-items: center; min-height: 46px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 999px; padding: 0 2px 0 16px">
      <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Message</label>
      <input id="msg" type="text" placeholder="Message…" style="flex: 1; min-width: 0; height: 42px; border: 0; padding: 0; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1C1C1C; background: transparent">
      <button type="button" aria-label="Envoyer une photo" style="width: 42px; height: 42px; flex-shrink: 0; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 8"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
