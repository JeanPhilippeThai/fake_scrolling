<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mon compte — échec de la suppression</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 4px; border-bottom: 1px solid #ECECEA">
    <button type="button" aria-label="Retour" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Mon compte</h1>
  </header>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #5E5E5B">Compte</span>
      <span style="font: 500 16px 'IBM Plex Mono', monospace">@moi.ici</span>
    </div>
    <button type="button" style="min-height: 52px; border-radius: 12px; border: 1px solid #B42318; background: #FFFFFF; color: #B42318; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Supprimer mon compte</button>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(28, 28, 28, 0.5); display: flex; align-items: center; justify-content: center; padding: 24px">
    <div role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc" style="width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="del-title" style="margin: 0; font-size: 19px; font-weight: 600">Supprimer ton compte ?</h2>
      <p id="del-desc" style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E5E5B">Tes posts, tes messages et tes amis seront effacés. C’est définitif.</p>
      <p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 14px; line-height: 1.4; color: #B42318">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.1"></path></svg>
        Ton compte n’a pas pu être supprimé. Rien n’a été effacé.
      </p>
      <button type="button" style="min-height: 48px; border: 0; border-radius: 12px; background: #B42318; color: #FFFFFF; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Réessayer</button>
      <button type="button" style="min-height: 48px; border: 1px solid #DEDEDA; border-radius: 12px; background: #FFFFFF; color: #1C1C1C; font: 600 16px 'IBM Plex Sans', sans-serif; cursor: pointer">Annuler</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
