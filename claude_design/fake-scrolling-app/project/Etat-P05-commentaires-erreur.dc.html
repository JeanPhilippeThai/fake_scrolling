<!doctype html>
<html lang="fr">
<head>

<title>Commentaires — erreur de chargement</title>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F4F9E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #24315E; color: #1C1C1C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; position: relative">
  <div aria-hidden="true" style="position: absolute; inset: 0; filter: blur(22px)">
    <div style="position: absolute; left: 30px; top: 120px; width: 220px; height: 220px; border-radius: 50%; background: #FF7A59"></div>
    <div style="position: absolute; left: 170px; top: 330px; width: 240px; height: 200px; border-radius: 30%; background: #2EC4B6"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28, 28, 28, 0.5)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 28px; border-radius: 24px 24px 0 0; background: #FFFFFF">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #DEDEDA"></span>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h2 id="sheet-title" style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 22px">Commentaires</h2>
      <button type="button" aria-label="Fermer" style="width: 44px; height: 44px; margin-right: -8px; padding: 0; border: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 14px; line-height: 1.4; color: #B42318">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.1"></path></svg>
        Les commentaires n’ont pas pu être chargés.
      </p>
      <button type="button" style="min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: #1C1C1C; font: 600 14px 'IBM Plex Sans', sans-serif; text-decoration: underline; cursor: pointer">Réessayer</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 0 2px; border-top: 1px solid #ECECEA">
      <span aria-hidden="true" style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #9EE493, #2EC4B6 55%, #118AB2); filter: blur(1.5px)"></span>
      <label for="comment-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Ajouter un commentaire</label>
      <input id="comment-input" type="text" placeholder="Ajouter un commentaire…" style="flex: 1; min-width: 0; height: 42px; box-sizing: border-box; border: 1px solid #DEDEDA; border-radius: 999px; padding: 0 14px; font: 400 15px 'IBM Plex Sans', sans-serif; color: #1C1C1C; background: #FFFFFF">
      <button type="button" disabled style="min-height: 42px; padding: 0 6px; border: 0; background: transparent; color: #8A8A86; font: 600 15px 'IBM Plex Sans', sans-serif">Publier</button>
    </div>
  </div>
</div>
</x-dc>

</html>
